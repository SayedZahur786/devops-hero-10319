apiVersion: apps/v1
kind: Deployment
metadata:
  name: session16-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session16-app
  template:
    metadata:
      labels:
        app: session16-app
    spec:
      containers:
        - name: session16-app
          image: ghcr.io/sayedzahur786/devops-hero-10319/session16-app:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
