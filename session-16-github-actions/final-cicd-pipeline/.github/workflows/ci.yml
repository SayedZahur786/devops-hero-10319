name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "Sessions/Session16/final-cicd-pipeline/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: Sessions/Session16/final-cicd-pipeline

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Sessions/Session16/final-cicd-pipeline/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term -v

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Sessions/Session16/final-cicd-pipeline/coverage.xml
          retention-days: 7

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -t session16-app:${{ github.sha }} Sessions/Session16/final-cicd-pipeline
        working-directory: .
