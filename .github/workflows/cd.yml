name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/sayedzahur786/devops-hero-10319/session16-app:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/sayedzahur786/devops-hero-10319/session16-app:latest" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: session-16-github-actions/final-cicd-pipeline
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy Manifests
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render deployment with pushed image tag
        run: |
          sed "s|__IMAGE_TAG__|${{ github.sha }}|g" session-16-github-actions/final-cicd-pipeline/k8s/deployment.yaml > rendered-deployment.yaml
          cat rendered-deployment.yaml
